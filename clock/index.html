<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>itit clock</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../style.css" />
<style>
  .clock {
    position: relative;
    padding: 8px 4px;
  }
  .row {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .date {
    font-size: 56px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -1.5px;
    color: var(--ink-strong);
    font-variant-numeric: tabular-nums;
  }
  .meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
  }
  .meta .day { color: var(--ink-strong); font-weight: 500; }
  .meta .sub { color: var(--ink-soft); font-size: 11.5px; }
  .time {
    margin-left: auto;
    font-size: 34px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    color: var(--ink-strong);
    letter-spacing: -1px;
  }
  .time .colon { opacity: .35; }
</style>
</head>
<body>
<div class="widget clock">
  <div class="label">Today</div>
  <div class="row">
    <div class="date" id="date">26</div>
    <div class="meta">
      <span class="day" id="dayline">7월 · 일요일</span>
      <span class="sub" id="week">2026 · 30주차</span>
    </div>
    <div class="time" id="time">14<span class="colon">:</span>32</div>
  </div>
</div>

<script>
  const DAYS = ['일','월','화','수','목','금','토'];
  function pad(n){ return String(n).padStart(2,'0'); }
  function weekOfYear(d){
    const start = new Date(d.getFullYear(),0,1);
    const days = Math.floor((d - start) / 86400000);
    return Math.ceil((days + start.getDay() + 1) / 7);
  }
  function render(){
    const d = new Date();
    document.getElementById('date').textContent = d.getDate();
    document.getElementById('dayline').textContent =
      (d.getMonth()+1) + '월 · ' + DAYS[d.getDay()] + '요일';
    document.getElementById('week').textContent =
      d.getFullYear() + ' · ' + weekOfYear(d) + '주차';
    document.getElementById('time').innerHTML =
      pad(d.getHours()) + '<span class="colon">:</span>' + pad(d.getMinutes());
  }
  render();
  setInterval(render, 30 * 1000);
</script>
</body>
</html>
