<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>itit signature</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../style.css" />
<style>
  .sig {
    text-align: center;
    padding: 16px 20px;
  }
  .mark {
    font-size: 16px;
    letter-spacing: 5px;
    color: var(--ink-strong);
    font-weight: 400;
    margin-bottom: 10px;
  }
  .sub {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 1.5px;
    margin-bottom: 14px;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-top: 12px;
    border-top: 1px dotted var(--sky);
  }
  .bar span {
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 1.5px;
    font-variant-numeric: tabular-nums;
  }
  .dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--ink-soft);
    display: inline-block;
  }
</style>
</head>
<body>
<div class="widget sig">
  <div class="mark">STUDIO ITJAE</div>
  <div class="sub">하고재비의 하루 · 잇는 사람</div>
  <div class="bar">
    <span id="year">2026</span>
    <span class="dot"></span>
    <span>MADE WITH CARE</span>
    <span class="dot"></span>
    <span id="quote">기록하는 사람</span>
  </div>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // 하단 오른쪽 문구 랜덤 (매일 다름)
  const QUOTES = [
    '기록하는 사람',
    '잇는 사람',
    '천천히 쌓는 사람',
    '문장을 모으는 사람',
    '하고재비',
    '오늘도 잇는다',
  ];
  const d = new Date();
  const seed = d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
  document.getElementById('quote').textContent = QUOTES[seed % QUOTES.length];
</script>
</body>
</html>
