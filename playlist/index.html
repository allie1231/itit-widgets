<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>itit playlist</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../style.css" />
<style>
  body { padding: 16px; }

  .pod {
    position: relative;
    width: 100%;
    max-width: 260px;
    margin: 0 auto;
  }

  /* 화면 */
  .screen {
    background: linear-gradient(160deg, #F5F9FC 0%, #EAF2F8 100%);
    border-radius: 14px;
    padding: 22px 20px 18px;
    text-align: center;
    color: var(--ink-strong);
    position: relative;
    overflow: hidden;
  }
  .screen .label {
    font-size: 8.5px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  /* 앨범 아트 자리 (iframe도 여기 겹침) */
  .art-wrap {
    position: relative;
    width: 62px;
    height: 62px;
    margin: 0 auto 12px;
  }
  .cover {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #FCE0E7 0%, #FDEFC9 55%, #D8E9F4 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
    transition: opacity .3s;
  }
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .art-wrap.playing .cover { opacity: 0; }
  .art-wrap.playing .frame { opacity: 1; pointer-events: auto; }

  .track-title {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-strong);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-num {
    font-size: 9.5px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }

  /* 컨트롤 휠 */
  .wheel {
    width: 130px;
    height: 130px;
    margin: 22px auto 4px;
    border-radius: 50%;
    background: #FAFBFD;
    position: relative;
    box-shadow: inset 0 0 0 1px #EAEDF0;
  }
  .wheel-btn {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1px;
    padding: 0;
    display: grid;
    place-items: center;
    transition: color .15s;
    z-index: 2;
  }
  .wheel-btn:hover { color: var(--ink-strong); }
  .wheel-btn.menu { top: 10px; left: 50%; transform: translateX(-50%); width: 40px; height: 20px; font-size: 8.5px; text-transform: uppercase; }
  .wheel-btn.prev { top: 50%; left: 8px; transform: translateY(-50%); width: 24px; height: 24px; font-size: 14px; }
  .wheel-btn.next { top: 50%; right: 8px; transform: translateY(-50%); width: 24px; height: 24px; font-size: 14px; }
  .wheel-btn.play { bottom: 10px; left: 50%; transform: translateX(-50%); width: 40px; height: 20px; font-size: 10px; }

  .center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: white;
    border: 1px solid #EAEDF0;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--ink-strong);
    font-size: 12px;
    letter-spacing: 1px;
    z-index: 3;
    padding: 0;
  }
  .center:hover { background: #FCFCFD; }

  /* 편집 패널 */
  .edit {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    background: #F5F9FC;
    border-radius: 10px;
  }
  .edit.on { display: block; }
  .edit-row {
    display: flex; gap: 6px; align-items: center;
    margin-bottom: 6px;
  }
  .edit-row input {
    flex: 1;
    padding: 6px 9px;
    border: 1px solid #DEE5EC;
    background: white;
    border-radius: 5px;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink-strong);
    outline: none;
    min-width: 0;
  }
  .edit-row input:focus { border-color: var(--ink); }
  .edit-row input.name { max-width: 90px; }
  .edit-row .del {
    width: 22px; height: 22px; border-radius: 4px;
    border: none; background: transparent;
    color: var(--ink-soft); cursor: pointer;
    font-size: 12px;
  }
  .edit-row .del:hover { color: var(--ink-strong); background: white; }
  .edit-actions {
    display: flex; gap: 4px; margin-top: 10px;
    justify-content: flex-end;
  }
  .edit-actions button {
    background: transparent; border: none;
    color: var(--ink-soft); cursor: pointer;
    padding: 5px 10px; border-radius: 5px;
    font-size: 10.5px;
    letter-spacing: .5px;
  }
  .edit-actions button:hover { background: white; color: var(--ink-strong); }
  .edit-actions button.save { color: var(--ink-strong); background: white; }
  .edit-actions button.save:hover { background: var(--sky); }
</style>
</head>
<body>
<div class="pod">
  <div class="screen">
    <div class="label">Now playing</div>
    <div class="art-wrap" id="artWrap">
      <div class="cover"></div>
      <iframe class="frame" id="frame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    <div class="track-title" id="title">─</div>
    <div class="track-num" id="num">─</div>
  </div>

  <div class="wheel">
    <button class="wheel-btn menu" onclick="toggleEdit()">Menu</button>
    <button class="wheel-btn prev" onclick="prev()">‹</button>
    <button class="wheel-btn next" onclick="next()">›</button>
    <button class="wheel-btn play" onclick="togglePlay()" id="playLabel">Play</button>
    <button class="center" onclick="togglePlay()" id="centerBtn">▶</button>
  </div>

  <div class="edit" id="edit">
    <div id="list"></div>
    <div class="edit-actions">
      <button onclick="addRow()">+ 추가</button>
      <button class="save" onclick="saveEdit()">저장</button>
      <button onclick="closeEdit()">닫기</button>
    </div>
  </div>
</div>

<script>
  const KEY = 'itit.playlist';
  const DEFAULT = [
    { title: '잔잔한 오후', url: 'https://youtu.be/jfKfPfyJRdk' },
  ];

  let list = load();
  let current = 0;
  let playing = false;

  function load() {
    try {
      const v = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(v) && v.length) return v;
    } catch(e){}
    return DEFAULT;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(list)); }

  function toEmbed(raw) {
    if (!raw) return '';
    if (raw.includes('/embed/')) return raw;
    let m = raw.match(/youtu\.be\/([\w-]+)/);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    m = raw.match(/[?&]list=([\w-]+)/);
    if (m) return 'https://www.youtube.com/embed/videoseries?list=' + m[1];
    m = raw.match(/[?&]v=([\w-]+)/);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    return raw;
  }

  function render() {
    if (!list.length) {
      document.getElementById('title').textContent = '없음';
      document.getElementById('num').textContent = '메뉴 → 추가';
      return;
    }
    const t = list[current];
    document.getElementById('title').textContent = t.title;
    document.getElementById('num').textContent =
      String(current + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0');

    const frame = document.getElementById('frame');
    const artWrap = document.getElementById('artWrap');
    if (playing) {
      const url = toEmbed(t.url);
      frame.src = url + (url.includes('?') ? '&' : '?') + 'autoplay=1';
      artWrap.classList.add('playing');
      document.getElementById('playLabel').textContent = 'Pause';
      document.getElementById('centerBtn').textContent = '▐▐';
    } else {
      frame.src = '';
      artWrap.classList.remove('playing');
      document.getElementById('playLabel').textContent = 'Play';
      document.getElementById('centerBtn').textContent = '▶';
    }
  }

  function togglePlay() {
    if (!list.length) return;
    playing = !playing;
    render();
  }
  function prev() {
    if (!list.length) return;
    current = (current - 1 + list.length) % list.length;
    render();
  }
  function next() {
    if (!list.length) return;
    current = (current + 1) % list.length;
    render();
  }

  function toggleEdit() {
    const box = document.getElementById('edit');
    if (box.classList.contains('on')) {
      closeEdit();
    } else {
      openEdit();
    }
  }
  function openEdit() {
    const listBox = document.getElementById('list');
    listBox.innerHTML = '';
    list.forEach(t => addRow(t.title, t.url));
    document.getElementById('edit').classList.add('on');
  }
  function closeEdit() {
    document.getElementById('edit').classList.remove('on');
  }
  function addRow(title = '', url = '') {
    const listBox = document.getElementById('list');
    const row = document.createElement('div');
    row.className = 'edit-row';
    row.innerHTML =
      '<input class="name" placeholder="이름" value="' + escapeAttr(title) + '">' +
      '<input placeholder="youtube URL" value="' + escapeAttr(url) + '">' +
      '<button class="del">×</button>';
    row.querySelector('.del').onclick = () => row.remove();
    listBox.appendChild(row);
  }
  function saveEdit() {
    const rows = document.querySelectorAll('#list .edit-row');
    const next = [];
    rows.forEach(r => {
      const [t, u] = r.querySelectorAll('input');
      if (t.value.trim() && u.value.trim()) {
        next.push({ title: t.value.trim(), url: u.value.trim() });
      }
    });
    list = next.length ? next : DEFAULT;
    save();
    current = 0;
    playing = false;
    closeEdit();
    render();
  }

  function escapeAttr(s) {
    return String(s).replace(/"/g,'&quot;');
  }

  render();
</script>
</body>
</html>
