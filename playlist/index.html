<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>itit playlist</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../style.css" />
<style>
  body { padding: 16px; }
  .pl { position: relative; }
  .player {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 4px;
  }
  .cover {
    flex: 0 0 84px;
    height: 84px;
    border-radius: 14px;
    background: linear-gradient(135deg, #FCE0E7 0%, #FDEFC9 55%, #D8E9F4 100%);
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .cover iframe {
    width: 100%; height: 100%; border: 0;
    opacity: 0;
    transition: opacity .3s;
  }
  .cover.playing iframe { opacity: 1; }
  .cover .play {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: rgba(255,255,255,.9);
    font-size: 24px;
    pointer-events: none;
    transition: opacity .3s;
  }
  .cover.playing .play { opacity: 0; }
  .info { flex: 1; min-width: 0; }
  .title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-strong);
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sub {
    font-size: 11.5px;
    color: var(--ink-soft);
    letter-spacing: .3px;
  }
  .ctrl {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--ink);
    cursor: pointer;
    display: grid; place-items: center;
    font-size: 13px;
  }
  .btn:hover { background: var(--sky-soft); color: var(--ink-strong); }

  /* 편집 모드 */
  .edit-panel {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--sky-soft);
    border-radius: 10px;
  }
  .edit-panel.on { display: block; }
  .edit-row {
    display: flex; gap: 6px; align-items: center;
    margin-bottom: 6px;
    font-size: 11.5px;
  }
  .edit-row input {
    flex: 1;
    padding: 5px 8px;
    border: 1px solid var(--ink-soft);
    background: white;
    border-radius: 5px;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
    outline: none;
  }
  .edit-row input:focus { border-color: var(--ink); }
  .edit-row .del {
    width: 22px; height: 22px; border-radius: 50%;
    border: none; background: transparent;
    color: var(--ink-soft); cursor: pointer;
    font-size: 11px;
  }
  .edit-row .del:hover { color: var(--ink-strong); }
  .edit-actions {
    display: flex; gap: 8px; margin-top: 8px;
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .edit-actions button {
    background: transparent; border: none;
    color: var(--ink); cursor: pointer;
    padding: 4px 10px; border-radius: 5px;
  }
  .edit-actions button:hover { background: white; }
</style>
</head>
<body>
<div class="widget pl">
  <div class="label">Playlist</div>
  <button class="gear" title="편집" onclick="startEdit()">✎</button>
  <div class="player">
    <div class="cover" id="cover" onclick="togglePlay()">
      <iframe id="iframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <div class="play">▶</div>
    </div>
    <div class="info">
      <div class="title" id="title">잔잔한 오후</div>
      <div class="sub" id="sub">재영님 리스트 · 1 / 3</div>
    </div>
    <div class="ctrl">
      <button class="btn" onclick="prev()">‹</button>
      <button class="btn" onclick="next()">›</button>
    </div>
  </div>

  <div class="edit-panel" id="edit">
    <div id="edit-list"></div>
    <div class="edit-actions">
      <button onclick="addRow()">+ 플리 추가</button>
      <button onclick="saveEdit()">저장</button>
      <button onclick="cancelEdit()">닫기</button>
    </div>
  </div>
</div>

<script>
  const KEY = 'itit.playlists';
  const DEFAULT = [
    { title: '잔잔한 오후', url: 'https://www.youtube.com/embed/videoseries?list=PLkbxeFRJPfDlHDzNyDF5NpHPjbmXswUuw' },
    { title: '집중 재즈', url: 'https://www.youtube.com/embed/videoseries?list=PLwg22VSCR0W-ObTip8YrLNfXCS9F5D2qk' },
    { title: '카페 로파이', url: 'https://www.youtube.com/embed/jfKfPfyJRdk' },
  ];

  let plists = [];
  let current = 0;
  let playing = false;

  function load(){
    try {
      const v = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(v) && v.length) return v;
    } catch(e){}
    return DEFAULT;
  }
  function save(v){ localStorage.setItem(KEY, JSON.stringify(v)); }

  function toEmbed(raw){
    if (!raw) return '';
    // 이미 embed 형식
    if (raw.includes('/embed/')) return raw;
    // youtu.be/xxx
    let m = raw.match(/youtu\.be\/([\w-]+)/);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    // playlist=xxx
    m = raw.match(/[?&]list=([\w-]+)/);
    if (m) return 'https://www.youtube.com/embed/videoseries?list=' + m[1];
    // watch?v=xxx
    m = raw.match(/[?&]v=([\w-]+)/);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    return raw;
  }

  function render(){
    if (!plists.length) plists = load();
    const p = plists[current];
    document.getElementById('title').textContent = p.title;
    document.getElementById('sub').textContent =
      '재영님 리스트 · ' + (current + 1) + ' / ' + plists.length;
    if (playing) {
      const url = toEmbed(p.url);
      document.getElementById('iframe').src = url + (url.includes('?') ? '&' : '?') + 'autoplay=1';
    } else {
      document.getElementById('iframe').src = '';
    }
  }

  function togglePlay(){
    playing = !playing;
    document.getElementById('cover').classList.toggle('playing', playing);
    render();
  }
  function prev(){
    current = (current - 1 + plists.length) % plists.length;
    render();
  }
  function next(){
    current = (current + 1) % plists.length;
    render();
  }

  function startEdit(){
    const list = document.getElementById('edit-list');
    list.innerHTML = '';
    plists.forEach((p, i) => addRow(p.title, p.url));
    document.getElementById('edit').classList.add('on');
  }
  function addRow(title = '', url = ''){
    const list = document.getElementById('edit-list');
    const row = document.createElement('div');
    row.className = 'edit-row';
    row.innerHTML =
      '<input placeholder="이름" value="' + escapeAttr(title) + '" style="max-width:120px;">' +
      '<input placeholder="유튜브 URL" value="' + escapeAttr(url) + '">' +
      '<button class="del" onclick="this.parentElement.remove()">×</button>';
    list.appendChild(row);
  }
  function saveEdit(){
    const rows = document.querySelectorAll('#edit-list .edit-row');
    const next = [];
    rows.forEach(r => {
      const [t, u] = r.querySelectorAll('input');
      if (t.value.trim() && u.value.trim()) {
        next.push({ title: t.value.trim(), url: u.value.trim() });
      }
    });
    if (!next.length) return alert('최소 하나는 있어야 해요');
    save(next);
    plists = next;
    current = 0;
    playing = false;
    document.getElementById('cover').classList.remove('playing');
    document.getElementById('edit').classList.remove('on');
    render();
  }
  function cancelEdit(){
    document.getElementById('edit').classList.remove('on');
  }
  function escapeAttr(s){
    return String(s).replace(/"/g,'&quot;');
  }

  render();
</script>
</body>
</html>
