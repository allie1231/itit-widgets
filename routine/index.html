<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>itit routine</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../style.css" />
<style>
  .routine { position: relative; }
  .list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 4px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--ink);
    border-radius: 6px;
    transition: background .12s;
  }
  .item:hover { background: var(--sky-soft); }
  .check {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 4px;
    display: grid;
    place-items: center;
    color: transparent;
    font-size: 10px;
    transition: all .15s;
    flex-shrink: 0;
  }
  .item.done .check {
    background: var(--ink);
    border-color: var(--ink);
    color: white;
  }
  .item.done .txt {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--ink-soft);
    text-decoration-thickness: 1px;
  }
  .txt { flex: 1; }

  .summary {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dotted var(--sky);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: .5px;
  }
  .summary b {
    color: var(--ink-strong);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .hint-save {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity .3s;
  }
  .hint-save.show { opacity: .6; }
</style>
</head>
<body>
<div class="widget routine">
  <div class="label">Routine</div>
  <div class="list" id="list"></div>
  <div class="summary">
    <span>오늘 <b id="count">0</b> / 7</span>
    <span class="hint-save" id="hint">저장됨</span>
  </div>
</div>

<script src="../shared.js"></script>
<script>
  function render() {
    const today = ITIT.today();
    const rec = ITIT.loadRoutine(today);
    const list = document.getElementById('list');
    list.innerHTML = '';

    ITIT.ROUTINE_ITEMS.forEach(item => {
      const done = !!rec[item];
      const row = document.createElement('div');
      row.className = 'item' + (done ? ' done' : '');
      row.innerHTML =
        '<span class="check">✓</span>' +
        '<span class="txt"></span>';
      row.querySelector('.txt').textContent = item;
      row.addEventListener('click', () => {
        ITIT.saveRoutine(today, item, !done);
        ITIT.hint(document.getElementById('hint'));
        render();
      });
      list.appendChild(row);
    });

    const count = Object.keys(rec).length;
    document.getElementById('count').textContent = count;
  }

  render();
</script>
</body>
</html>
