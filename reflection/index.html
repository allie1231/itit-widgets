<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>itit reflection</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../style.css" />
<style>
  body { padding: 24px 20px; }
  .refl { position: relative; }
  .date-line {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-top: 4px;
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
  }
  .field {
    margin-bottom: 18px;
  }
  .field:last-of-type { margin-bottom: 0; }
  .field .k {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-strong);
    margin-bottom: 8px;
    letter-spacing: -.2px;
  }
  .field textarea {
    width: 100%;
    min-height: 56px;
    padding: 12px 14px;
    border: none;
    background: #FBFDFE;
    border-left: 3px solid var(--sky);
    border-radius: 4px;
    color: #3D5468;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 400;
    line-height: 1.7;
    resize: vertical;
    outline: none;
    transition: background .15s, border-color .15s;
    letter-spacing: -.1px;
  }
  .field textarea:focus {
    background: white;
    border-left-color: var(--ink);
  }
  .field textarea::placeholder {
    color: #B0C4D3;
    opacity: 1;
  }



  .hint-save {
    position: absolute;
    top: 24px;
    right: 0;
    font-size: 9.5px;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity .3s;
  }
  .hint-save.show { opacity: .7; }
</style>
</head>
<body>
<div class="widget refl">
  <div class="label">Reflection</div>
  <div class="date-line" id="dateLine">—</div>
  <span class="hint-save" id="hint">저장됨</span>

  <div class="field good">
    <div class="k">잘한 것</div>
    <textarea id="good" placeholder="오늘 좋았던 순간을 짧게라도 남겨두세요" rows="2"></textarea>
  </div>
  <div class="field bad">
    <div class="k">아쉬운 것</div>
    <textarea id="bad" placeholder="다시 하면 다르게 할 수 있는 것" rows="2"></textarea>
  </div>
  <div class="field next">
    <div class="k">다음에는</div>
    <textarea id="next" placeholder="내일 조금이라도 시도해볼 것" rows="2"></textarea>
  </div>
</div>

<script src="../shared.js"></script>
<script>
  const DAYS = ['일','월','화','수','목','금','토'];
  const today = ITIT.today();
  const d = new Date();
  document.getElementById('dateLine').textContent =
    (d.getMonth()+1) + '월 ' + d.getDate() + '일 · ' + DAYS[d.getDay()] + '요일';

  const rec = ITIT.loadReflection(today);
  document.getElementById('good').value = rec.good || '';
  document.getElementById('bad').value = rec.bad || '';
  document.getElementById('next').value = rec.next || '';

  ['good', 'bad', 'next'].forEach(field => {
    const el = document.getElementById(field);
    let saveTimer;
    el.addEventListener('input', () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        ITIT.saveReflection(today, field, el.value);
        ITIT.hint(document.getElementById('hint'));
      }, 400);
    });
  });
</script>
</body>
</html>
