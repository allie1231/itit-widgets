<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>itit mood</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../style.css" />
<style>
  .mood { position: relative; }
  .row {
    margin-bottom: 20px;
  }
  .row:last-child { margin-bottom: 0; }
  .when {
    font-size: 10.5px;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .levels {
    display: flex;
    gap: 6px;
  }
  .lv {
    flex: 1;
    padding: 10px 4px 12px;
    text-align: center;
    background: transparent;
    border: 1px solid var(--sky-soft);
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 11px;
    line-height: 1.3;
    transition: all .15s;
  }
  .lv:hover {
    border-color: var(--ink-soft);
    color: var(--ink);
  }
  .lv.active {
    border-color: var(--ink);
    color: var(--ink-strong);
    background: var(--sel, transparent);
  }
  .lv .num {
    display: block;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 3px;
    color: var(--ink);
  }
  .lv.active .num { color: var(--ink-strong); }

  .hint-save {
    position: absolute;
    bottom: 0;
    right: 0;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity .3s;
  }
  .hint-save.show { opacity: .6; }
</style>
</head>
<body>
<div class="widget mood">
  <div class="label">Mood</div>

  <div class="row">
    <div class="when">아침</div>
    <div class="levels" data-when="morning">
      <button class="lv" data-level="1"><span class="num">1</span>저조</button>
      <button class="lv" data-level="2"><span class="num">2</span>무난</button>
      <button class="lv" data-level="3"><span class="num">3</span>좋음</button>
      <button class="lv" data-level="4"><span class="num">4</span>활력</button>
      <button class="lv" data-level="5"><span class="num">5</span>최고</button>
    </div>
  </div>

  <div class="row">
    <div class="when">밤</div>
    <div class="levels" data-when="night">
      <button class="lv" data-level="1"><span class="num">1</span>저조</button>
      <button class="lv" data-level="2"><span class="num">2</span>무난</button>
      <button class="lv" data-level="3"><span class="num">3</span>좋음</button>
      <button class="lv" data-level="4"><span class="num">4</span>활력</button>
      <button class="lv" data-level="5"><span class="num">5</span>최고</button>
    </div>
  </div>

  <span class="hint-save" id="hint">저장됨</span>
</div>

<script src="../shared.js"></script>
<script>
  const COLORS = ITIT.MOOD_COLORS;

  function render() {
    const today = ITIT.today();
    const rec = ITIT.loadMood(today);

    document.querySelectorAll('.levels').forEach(box => {
      const when = box.dataset.when;
      const current = rec[when];
      box.querySelectorAll('.lv').forEach(btn => {
        const lv = parseInt(btn.dataset.level);
        const on = lv === current;
        btn.classList.toggle('active', on);
        btn.style.setProperty('--sel', on ? COLORS[lv] : 'transparent');
      });
    });
  }

  document.querySelectorAll('.lv').forEach(btn => {
    btn.addEventListener('click', () => {
      const when = btn.parentElement.dataset.when;
      const level = parseInt(btn.dataset.level);
      const today = ITIT.today();
      const rec = ITIT.loadMood(today);

      // 같은 것 다시 누르면 해제
      if (rec[when] === level) {
        delete rec[when];
        ITIT.save('mood.' + today, rec);
      } else {
        ITIT.saveMood(today, when, level);
      }
      ITIT.hint(document.getElementById('hint'));
      render();
    });
  });

  render();
</script>
</body>
</html>
