<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>itit progress</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../style.css" />
<style>
  .prog {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 200px;
  }
  .bar {
    height: 6px;
    background: var(--sky-soft);
    border-radius: 999px;
    overflow: hidden;
    margin: 8px 0 10px;
  }
  .fill {
    height: 100%;
    background: var(--sky);
    border-radius: 999px;
    transition: width .5s ease;
  }
  .scale {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    letter-spacing: .5px;
    margin-bottom: 24px;
  }
  .remain {
    font-size: 14px;
    color: var(--ink);
    opacity: .85;
    line-height: 1.5;
  }
  .remain b {
    font-weight: 500;
    color: var(--ink-strong);
    font-variant-numeric: tabular-nums;
  }
  .percent {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
    letter-spacing: .5px;
  }
</style>
</head>
<body>
<div class="widget prog">
  <div class="label">Progress</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="scale"><span>09</span><span>13</span><span>17</span><span>22</span></div>
  <div class="remain">남은 시간 <b id="remain">7h 28m</b></div>
  <div class="percent" id="percent">오늘 56% 지났어요</div>
</div>

<script>
  const START = 9;   // 09:00
  const END = 24;    // 24:00
  function render(){
    const d = new Date();
    const h = d.getHours() + d.getMinutes()/60;
    let pct;
    if (h < START) pct = 0;
    else if (h > END) pct = 100;
    else pct = ((h - START) / (END - START)) * 100;

    const remainH = Math.max(0, END - h);
    const rh = Math.floor(remainH);
    const rm = Math.floor((remainH - rh) * 60);

    document.getElementById('fill').style.width = pct.toFixed(1) + '%';
    document.getElementById('remain').textContent = rh + 'h ' + rm + 'm';
    document.getElementById('percent').textContent = '오늘 ' + Math.round(pct) + '% 지났어요';
  }
  render();
  setInterval(render, 60 * 1000);
</script>
</body>
</html>
