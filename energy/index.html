<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>itit energy</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../style.css" />
<style>
  .energy { position: relative; }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .top .label { margin-bottom: 0; }
  .avg {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: .5px;
  }
  .avg b {
    color: var(--ink-strong);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }

  .chart {
    width: 100%;
    height: 160px;
    display: block;
  }
  .grid-line {
    stroke: var(--sky-soft);
    stroke-width: 1;
    stroke-dasharray: 3 4;
  }
  .axis-label {
    fill: var(--ink-soft);
    font-size: 10px;
    letter-spacing: .5px;
  }
  .line {
    fill: none;
    stroke: var(--ink-soft);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .line.night {
    stroke-dasharray: 3 3;
  }
  .dot {
    fill: white;
    stroke: var(--ink);
    stroke-width: 1.5;
  }
  .dot.today {
    fill: var(--butter-2);
    stroke: var(--ink-strong);
    stroke-width: 2;
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: .5px;
  }
  .legend span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend .swatch {
    width: 16px;
    height: 2px;
    background: var(--ink-soft);
  }
  .legend .swatch.dashed {
    background: repeating-linear-gradient(
      to right,
      var(--ink-soft) 0 3px,
      transparent 3px 6px
    );
  }
</style>
</head>
<body>
<div class="widget energy">
  <div class="top">
    <div class="label">Energy</div>
    <div class="avg">이번 주 평균 <b id="avgVal">—</b></div>
  </div>

  <svg class="chart" id="chart" viewBox="0 0 560 160" preserveAspectRatio="xMidYMid meet"></svg>

  <div class="legend">
    <span><span class="swatch"></span>아침</span>
    <span><span class="swatch dashed"></span>밤</span>
  </div>
</div>

<script src="../shared.js"></script>
<script>
  const W = 560, H = 160;
  const PAD = { left: 26, right: 12, top: 12, bottom: 26 };

  function render() {
    const chart = document.getElementById('chart');
    chart.innerHTML = '';

    const week = ITIT.thisWeek();
    const today = ITIT.today();
    const todayIdx = week.indexOf(today);

    // 데이터: 요일별 [morning, night] (null = 없음)
    const data = week.map(d => {
      const m = ITIT.loadMood(d);
      return { morning: m.morning || null, night: m.night || null };
    });

    const chartW = W - PAD.left - PAD.right;
    const chartH = H - PAD.top - PAD.bottom;
    const stepX = chartW / 6;

    // Y 좌표: 1 = bottom, 5 = top
    function y(level) {
      return PAD.top + chartH - ((level - 1) / 4) * chartH;
    }
    function x(i) {
      return PAD.left + i * stepX;
    }

    // 그리드 (1, 3, 5)
    [1, 3, 5].forEach(lv => {
      const yy = y(lv);
      chart.innerHTML +=
        '<line class="grid-line" x1="' + PAD.left + '" y1="' + yy +
        '" x2="' + (W - PAD.right) + '" y2="' + yy + '"/>';
      chart.innerHTML +=
        '<text class="axis-label" x="' + (PAD.left - 8) + '" y="' + (yy + 3) +
        '" text-anchor="end">' + lv + '</text>';
    });

    // X 축 라벨 (M T W T F S S)
    const DAYS_LABEL = ['월','화','수','목','금','토','일'];
    week.forEach((d, i) => {
      const isToday = i === todayIdx;
      const color = isToday ? 'var(--ink-strong)' : 'var(--ink-soft)';
      const weight = isToday ? '500' : '400';
      chart.innerHTML +=
        '<text class="axis-label" x="' + x(i) + '" y="' + (H - PAD.bottom + 14) +
        '" text-anchor="middle" fill="' + color + '" font-weight="' + weight + '">' +
        DAYS_LABEL[i] + '</text>';
    });

    // 라인 (아침 · 밤)
    function drawLine(field, className) {
      const points = data
        .map((d, i) => d[field] !== null ? { i, lv: d[field] } : null)
        .filter(Boolean);
      if (points.length < 1) return;

      // path
      if (points.length >= 2) {
        let path = 'M ' + x(points[0].i) + ' ' + y(points[0].lv);
        for (let k = 1; k < points.length; k++) {
          path += ' L ' + x(points[k].i) + ' ' + y(points[k].lv);
        }
        chart.innerHTML +=
          '<path class="line ' + className + '" d="' + path + '"/>';
      }

      // dots
      points.forEach(p => {
        const isToday = p.i === todayIdx;
        const cls = 'dot' + (isToday ? ' today' : '');
        chart.innerHTML +=
          '<circle class="' + cls + '" cx="' + x(p.i) + '" cy="' + y(p.lv) +
          '" r="' + (isToday ? 5 : 3.5) + '"/>';
      });
    }

    drawLine('morning', '');
    drawLine('night', 'night');

    // 평균
    const allVals = data.flatMap(d => [d.morning, d.night]).filter(v => v !== null);
    if (allVals.length) {
      const avg = allVals.reduce((a, b) => a + b, 0) / allVals.length;
      document.getElementById('avgVal').textContent = avg.toFixed(1);
    } else {
      document.getElementById('avgVal').textContent = '—';
    }
  }

  render();
  // 무드 위젯에서 저장이 일어나면 새로고침 감지
  window.addEventListener('storage', (e) => {
    if (e.key && e.key.startsWith('itit.mood.')) render();
  });
</script>
</body>
</html>
